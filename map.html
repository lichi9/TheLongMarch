<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9e2d1">
<title>行军图 · 长征：拾光</title>
<link rel="stylesheet" href="core/map.css">
</head>
<body>

<div id="stage">

  <svg class="map" viewBox="0 0 1280 720" aria-label="山河行军图，点击印章进入关卡">
    <defs>
      <linearGradient id="redline" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0"   stop-color="#8f2519"/>
        <stop offset="0.5" stop-color="#b23a2c"/>
        <stop offset="1"   stop-color="#9b2b1d"/>
      </linearGradient>

      <!-- 三层山的墨色，越远越淡 -->
      <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8a7a62" stop-opacity="0.30"/>
        <stop offset="1" stop-color="#8a7a62" stop-opacity="0.05"/>
      </linearGradient>
      <linearGradient id="peakMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7d6d57" stop-opacity="0.34"/>
        <stop offset="1" stop-color="#7d6d57" stop-opacity="0.04"/>
      </linearGradient>
      <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b5c47" stop-opacity="0.30"/>
        <stop offset="1" stop-color="#6b5c47" stop-opacity="0.02"/>
      </linearGradient>
      <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b23a2c" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#b23a2c" stop-opacity="0.03"/>
      </linearGradient>

      <!-- 枯笔：让朱砂线带一点毛笔飞白 -->
      <filter id="drybrush" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.08 0.4" numOctaves="3" seed="12" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <pattern id="p-xiangjiang" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/xiangjiang.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-zunyi" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/zunyi.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-chishui" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/chishui.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-jinshajiang" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/jinshajiang.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-ludingqiao" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/ludingqiao.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-xueshan" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/xueshan.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-caodi" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/caodi.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-huining" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/huining.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <!-- 场景图边缘羽化 -->
      <radialGradient id="softFade" cx="50%" cy="50%" r="50%">
        <stop offset="0"    stop-color="#fff" stop-opacity="1"/>
        <stop offset="0.32" stop-color="#fff" stop-opacity="0.62"/>
        <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="soft" maskContentUnits="objectBoundingBox">
        <rect width="1" height="1" fill="url(#softFade)"/>
      </mask>
    </defs>

    <!-- 宣纸底 -->
    <rect width="1280" height="720" fill="#f2e9d6"/>

    <!-- ============ 场景底层：每个节点对应的水墨小景 ============ -->
    <image class="scene-img" href="assets/brand/map/yudu.webp" x="970" y="406" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/xiangjiang.webp" x="846" y="312" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/zunyi.webp" x="716" y="364" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/chishui.webp" x="586" y="268" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/jinshajiang.webp" x="464" y="354" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/ludingqiao.webp" x="374" y="242" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/xueshan.webp" x="286" y="154" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/caodi.webp" x="186" y="82" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/huining.webp" x="46" y="2" width="400" height="372" mask="url(#soft)"/>

    <!-- ============ 抽象山峦：三层色带，不画任何具体地形 ============ -->
    <!-- 远山 -->
    <path d="M0,246 C150,212 296,268 452,236 C608,204 754,262 910,232
             C1066,202 1180,250 1280,224 L1280,720 L0,720 Z"
          fill="url(#peakFar)"/>
    <!-- 中山 -->
    <path d="M0,338 C140,300 300,356 462,322 C624,288 786,346 948,314
             C1110,282 1200,330 1280,306 L1280,720 L0,720 Z"
          fill="url(#peakMid)"/>
    <!-- 近山 -->
    <path d="M0,452 C170,416 330,470 500,438 C670,406 836,460 1006,430
             C1146,406 1220,442 1280,424 L1280,720 L0,720 Z"
          fill="url(#peakNear)"/>

    <!-- 山脊线：只勾最上层，克制 -->
    <path d="M0,246 C150,212 296,268 452,236 C608,204 754,262 910,232
             C1066,202 1180,250 1280,224"
          fill="none" stroke="#7d6d57" stroke-width="1.4" opacity="0.28"/>
    <path d="M0,338 C140,300 300,356 462,322 C624,288 786,346 948,314
             C1110,282 1200,330 1280,306"
          fill="none" stroke="#5c5548" stroke-width="1.4" opacity="0.22"/>

    <!-- 右下：江面，横向波纹 -->
    <path d="M740,720 L1280,600 L1280,720 Z" fill="url(#water)"/>
    <g stroke="#b23a2c" stroke-width="1.8" fill="none" opacity="0.3">
      <path d="M768,690 L848,682 L928,690 L1008,682 L1088,690 L1168,682 L1240,690"/>
      <path d="M820,716 L900,708 L980,716 L1060,708 L1140,716 L1220,708"/>
    </g>

    <!-- ================= 行军路线 ================= -->
    <!-- 一条线走到底：赤水前折两下，暗示"四渡"的来回 -->
    <path d="M1170,592 L1046,498 L916,550 L858,506 L832,528 L786,454
             L664,540 L574,428 L486,340 L386,268"
          fill="none" stroke="url(#redline)" stroke-width="9"
          stroke-linejoin="miter" stroke-linecap="butt"/>

    <!-- 草地到终点：虚线 -->
    <path d="M386,268 L246,188"
          fill="none" stroke="#c12b22" stroke-width="7"
          stroke-dasharray="13 10" stroke-linecap="butt" opacity="0.85"/>

    <!-- 起点：小旗 -->
    <g transform="translate(1170,592)" pointer-events="none">
      <path d="M0,0 L0,-46" stroke="#1b1916" stroke-width="3"/>
      <path d="M2,-44 L30,-35 L2,-26 Z" fill="#c12b22"/>
      <text x="0" y="24" class="lab down name" style="font-size:13px">于都出发</text>
    </g>

    <!-- ================= 印章节点 ================= -->
    <!-- 说明：locked = 未通关（灰虚线圈） / done = 已通关（红实心 + 党徽）
               current = 进行中（红圈 + 扩散脉冲） -->

    <!-- 01 湘江 2人 -->
    <g class="seal locked" data-level="hzh,mt" tabindex="0" role="button"
       aria-label="血战湘江，2 个关卡" transform="translate(1046,498)">
      <circle class="hit" r="46"/>
      <circle class="ring" r="32"/><circle class="pulse" r="37.0"/>
      <text class="glyph" y="1">湘</text>
      <text class="idx" x="-42" y="-24">01</text>
      <text class="lab right name" x="46" y="2">血战湘江</text>
    </g>

    <!-- 02 遵义 1人 -->
    <g class="seal locked" data-level="zsb" tabindex="0" role="button"
       aria-label="遵义会议" transform="translate(916,550)">
      <circle class="hit" r="42"/>
      <circle class="ring" r="29"/><circle class="pulse" r="34.0"/>
      <text class="glyph" y="1">遵</text>
      <text class="idx" x="-38" y="-22">02</text>
      <text class="lab down name" y="50">遵义会议</text>
    </g>

    <!-- 03 赤水 4人 -->
    <g class="seal locked" data-level="sst,nzh,ljm,qrz" tabindex="0" role="button"
       aria-label="四渡赤水，4 个关卡" transform="translate(786,454)">
      <circle class="hit" r="48"/>
      <circle class="ring" r="36"/><circle class="pulse" r="41.0"/>
      <text class="glyph" y="1">赤</text>
      <text class="idx" x="-46" y="-26">03</text>
      <text class="lab right name" x="52" y="-4">四渡赤水</text>
    </g>

    <!-- 04 金沙江 2人 -->
    <g class="seal locked" data-level="cl,wxh" tabindex="0" role="button"
       aria-label="巧渡金沙江，2 个关卡" transform="translate(664,540)">
      <circle class="hit" r="46"/>
      <circle class="ring" r="32"/><circle class="pulse" r="37.0"/>
      <text class="glyph" y="1">金</text>
      <text class="idx" x="-42" y="-24">04</text>
      <text class="lab down name" y="53">巧渡金沙江</text>
    </g>

    <!-- 05 泸定桥 4人 -->
    <g class="seal locked" data-level="lhdq,zjx,mmx,hry" tabindex="0" role="button"
       aria-label="飞夺泸定桥，4 个关卡" transform="translate(574,428)">
      <circle class="hit" r="48"/>
      <circle class="ring" r="36"/><circle class="pulse" r="41.0"/>
      <text class="glyph" y="1">泸</text>
      <text class="idx" x="-46" y="-26">05</text>
      <text class="lab left name" x="-50" y="2">飞夺泸定桥</text>
    </g>

    <!-- 06 雪山 2人 -->
    <g class="seal locked" data-level="jxf,lyc" tabindex="0" role="button"
       aria-label="翻越夹金山，2 个关卡" transform="translate(486,340)">
      <circle class="hit" r="46"/>
      <circle class="ring" r="32"/><circle class="pulse" r="37.0"/>
      <text class="glyph" y="1">雪</text>
      <text class="idx" x="-42" y="-24">06</text>
      <text class="lab left name" x="-48" y="2">翻越夹金山</text>
    </g>

    <!-- 07 草地 5人 -->
    <g class="seal locked" data-level="ftm,mhm,zzy,zbw,ldy" tabindex="0" role="button"
       aria-label="走出松潘草地，5 个关卡" transform="translate(386,268)">
      <circle class="hit" r="50"/>
      <circle class="ring" r="38"/><circle class="pulse" r="43.0"/>
      <text class="glyph" y="1">草</text>
      <text class="idx" x="-48" y="-28">07</text>
      <text class="lab right name" x="52" y="-4">走出草地</text>
    </g>

    <!-- 08 会宁：终点星章 -->
    <g class="seal locked final" data-level="" tabindex="0" role="button"
       aria-label="会宁会师，终章" transform="translate(246,188)">
      <circle class="hit" r="56"/>
      <circle class="ring" r="44"/><circle class="pulse" r="49.0"/>
      <path class="glyph-star" d="M0,-30 L8.8,-6.3 L33.9,-6.3 L13.7,8.3
               L21.3,32.4 L0,18.6 L-21.3,32.4 L-13.7,8.3 L-33.9,-6.3 L-8.8,-6.3 Z"
            fill="none" stroke="#8e897e" stroke-width="2.6" stroke-linejoin="miter"/>
      <text class="idx" x="-56" y="-30">08</text>
      <text class="lab right name" x="52" y="2" style="font-size:17px">会宁会师</text>
    </g>

  </svg>

  <button class="back" id="btn-back" type="button">返回主页面</button>

  <div class="hint">
    <span>点击进入关卡</span>
    <span class="legend">
      <svg class="lg" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="#c8483a"/><circle cx="9" cy="9" r="8.5" fill="none" stroke="#c8483a" stroke-width="1" opacity=".45"/></svg>进行中
      <svg class="lg" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#c8483a" stroke-width="2" stroke-dasharray="3 2.6"/></svg>未通关
      <svg class="lg" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#c8483a" stroke-width="2.6"/></svg>已通关
    </span>
  </div>

  <div class="tip" id="tip" role="status"></div>
</div>

<div class="rotate-hint">
  <p>请把手机横过来<br>画面按 16:9 铺开</p>
</div>

<script>
(function () {
  'use strict';

  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.documentElement.style.setProperty('--s', s);
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  document.getElementById('btn-back').addEventListener('click', function () {
    location.href = 'index.html';
  });

  var seals = document.querySelectorAll('.seal');
  var tip = document.getElementById('tip');
  var stage = document.getElementById('stage');

  /* 三种状态的提示语 */
  var TIPS = {
    locked:  '请先完成前面的关卡',
    done:    '重新体验',
    current: '继续'
  };

  function stateOf(el) {
    if (el.classList.contains('current')) return 'current';
    if (el.classList.contains('done')) return 'done';
    return 'locked';
  }

  /* 把视口坐标换算到 1280×720 的舞台坐标 */
  function toStage(clientX, clientY) {
    var r = stage.getBoundingClientRect();
    var k = r.width / 1280 || 1;
    return { x: (clientX - r.left) / k, y: (clientY - r.top) / k };
  }

  function showTip(el, ev) {
    if (!tip) return;
    tip.textContent = TIPS[stateOf(el)];
    var p = toStage(ev.clientX, ev.clientY);
    tip.style.left = p.x + 'px';
    tip.style.top = p.y + 'px';
    tip.classList.add('show');
  }

  function hideTip() {
    if (tip) tip.classList.remove('show');
  }

  /* 默认：第一枚是"当前"，其余未通关。
     ?demo=1 演示完整进度：第一枚已通关、第二枚进行中，其余未通关。 */
  if (seals.length) {
    seals[0].classList.remove('locked');
    seals[0].classList.add('current');

    if (/[?&]demo=1\b/.test(location.search)) {
      seals[0].classList.remove('current');
      seals[0].classList.add('done');
      if (seals[1]) {
        seals[1].classList.remove('locked');
        seals[1].classList.add('current');
      }
      if (seals[2]) {
        seals[2].classList.remove('locked');
        seals[2].classList.add('done');
      }
    }
  }





  for (var i = 0; i < seals.length; i++) {
    (function (el) {
      function go() {
        var ids = el.getAttribute('data-level');
        if (!ids) {
          console.log('[map] 终章节点，暂未接入');
          return;
        }
        console.log('[map] 进入关卡组：', ids.split(','));
      }
      el.addEventListener('click', go);
      el.addEventListener('mouseenter', function (e) { showTip(el, e); });
      el.addEventListener('mousemove', function (e) { showTip(el, e); });
      el.addEventListener('mouseleave', hideTip);
      el.addEventListener('focus', function () {
        var r = el.getBoundingClientRect();
        showTip(el, { clientX: r.left + r.width / 2, clientY: r.top });
      });
      el.addEventListener('blur', hideTip);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    })(seals[i]);
  }
})();
</script>

</body>
</html>
