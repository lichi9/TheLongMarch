<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9e2d1">
<title>行军图 · 长征：拾光</title>
<link rel="stylesheet" href="core/map.css">
</head>
<body>

<div id="stage">

  <svg class="map" viewBox="0 0 1280 720" aria-label="山河行军图，点击印章进入关卡">
    <defs>
      <linearGradient id="redline" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0"   stop-color="#8f2519"/>
        <stop offset="0.5" stop-color="#b23a2c"/>
        <stop offset="1"   stop-color="#9b2b1d"/>
      </linearGradient>

      <!-- 三层山的墨色，越远越淡 -->
      <linearGradient id="peakFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8a7a62" stop-opacity="0.30"/>
        <stop offset="1" stop-color="#8a7a62" stop-opacity="0.05"/>
      </linearGradient>
      <linearGradient id="peakMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7d6d57" stop-opacity="0.34"/>
        <stop offset="1" stop-color="#7d6d57" stop-opacity="0.04"/>
      </linearGradient>
      <linearGradient id="peakNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b5c47" stop-opacity="0.30"/>
        <stop offset="1" stop-color="#6b5c47" stop-opacity="0.02"/>
      </linearGradient>
      <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b23a2c" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#b23a2c" stop-opacity="0.03"/>
      </linearGradient>

      <!-- 枯笔：让朱砂线带一点毛笔飞白 -->
      <filter id="drybrush" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.08 0.4" numOctaves="3" seed="12" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <pattern id="p-xiangjiang" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/xiangjiang.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-zunyi" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/zunyi.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-chishui" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/chishui.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-jinshajiang" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/jinshajiang.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-ludingqiao" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/ludingqiao.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-xueshan" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/xueshan.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-caodi" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/caodi.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <pattern id="p-huining" width="1" height="1" patternContentUnits="objectBoundingBox">
        <image href="assets/brand/map/huining.webp" width="1" height="1"
               preserveAspectRatio="xMidYMid slice"/>
      </pattern>
      <!-- 场景图边缘羽化 -->
      <radialGradient id="softFade" cx="50%" cy="50%" r="50%">
        <stop offset="0"    stop-color="#fff" stop-opacity="1"/>
        <stop offset="0.22" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="0.55" stop-color="#fff" stop-opacity="0.45"/>
        <stop offset="0.8"  stop-color="#fff" stop-opacity="0.12"/>
        <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="soft" maskContentUnits="objectBoundingBox">
        <rect width="1" height="1" fill="url(#softFade)"/>
      </mask>
    </defs>

    <!-- 宣纸底 -->
    <rect width="1280" height="720" fill="#f2e9d6"/>

    <!-- ============ 场景底层：每个节点对应的水墨小景 ============ -->
    <image class="scene-img" href="assets/brand/map/yudu.webp" x="970" y="406" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/xiangjiang.webp" x="846" y="312" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/zunyi.webp" x="716" y="364" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/chishui.webp" x="586" y="268" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/jinshajiang.webp" x="464" y="354" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/ludingqiao.webp" x="374" y="242" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/xueshan.webp" x="286" y="154" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/caodi.webp" x="186" y="82" width="400" height="372" mask="url(#soft)"/>
    <image class="scene-img" href="assets/brand/map/huining.webp" x="46" y="2" width="400" height="372" mask="url(#soft)"/>

    <!-- ============ 抽象山峦：三层色带，不画任何具体地形 ============ -->
    <!-- 远山 -->
    <path d="M0,246 C150,212 296,268 452,236 C608,204 754,262 910,232
             C1066,202 1180,250 1280,224 L1280,720 L0,720 Z"
          fill="url(#peakFar)"/>
    <!-- 中山 -->
    <path d="M0,338 C140,300 300,356 462,322 C624,288 786,346 948,314

          fill="url(#peakMid)"/>
    <!-- 近山 -->
    <path d="M0,452 C170,416 330,470 500,438 C670,406 836,460 1006,430

          fill="url(#peakNear)"/>

    <!-- 山脊线：只勾最上层，克制 -->

          fill="none" stroke="#7d6d57" stroke-width="1.4" opacity="0.28"/>
    <path d="M0,338 C140,300 300,356 462,322 C624,288 786,346 948,314
             C1110,282 1200,330 1280,306"
          fill="none" stroke="#5c5548" stroke-width="1.4" opacity="0.22"/>

    <!-- 右下：江面，横向波纹 -->
    <path d="M740,720 L1280,600 L1280,720 Z" fill="url(#water)"/>
    <g stroke="#b23a2c" stroke-width="1.8" fill="none" opacity="0.3">
      <path d="M768,690 L848,682 L928,690 L1008,682 L1088,690 L1168,682 L1240,690"/>
      <path d="M820,716 L900,708 L980,716 L1060,708 L1140,716 L1220,708"/>
    </g>

          fill="none" stroke="url(#redline)" stroke-width="9"
          stroke-linejoin="miter" stroke-linecap="butt"/>

          stroke-dasharray="13 10" stroke-linecap="butt" opacity="0.85"/>

      <path d="M2,-44 L30,-35 L2,-26 Z" fill="#c12b22"/>
      <text x="0" y="24" class="lab down name" style="font-size:13px">于都出发</text>
    </g>

    <!-- ================= 印章节点 ================= -->
    <!-- 说明：locked = 未通关（灰虚线圈） / done = 已通关（红实心 + 党徽）
               current = 进行中（红圈 + 扩散脉冲） -->

    <!-- 01 湘江 2人 -->
    <g class="seal locked" data-level="hzh,mt" tabindex="0" role="button"
       aria-label="血战湘江，2 个关卡" transform="translate(1046,498)">
      <circle class="hit" r="46"/>
      <circle class="ring" r="32"/><circle class="pulse" r="37.0"/>
      <text class="glyph" y="1">湘</text>
      <text class="idx" x="-42" y="-24">01</text>
      <text class="lab right name" x="46" y="2">血战湘江</text>
    </g>

    <!-- 02 遵义 1人 -->
    <g class="seal locked" data-level="zsb" tabindex="0" role="button"

      <circle class="hit" r="42"/>
      <circle class="ring" r="29"/><circle class="pulse" r="34.0"/>
      <text class="glyph" y="1">遵</text>
      <text class="idx" x="-38" y="-22">02</text>
      <text class="lab down name" y="50">遵义会议</text>

    <!-- 03 赤水 4人 -->

      <circle class="ring" r="36"/><circle class="pulse" r="41.0"/>
      <text class="glyph" y="1">赤</text>
      <text class="idx" x="-46" y="-26">03</text>
      <text class="lab right name" x="52" y="-4">四渡赤水</text>
    </g>

    <!-- 04 金沙江 2人 -->
    <g class="seal locked" data-level="cl,wxh" tabindex="0" role="button"
       aria-label="巧渡金沙江，2 个关卡" transform="translate(664,540)">
      <circle class="hit" r="46"/>
      <circle class="ring" r="32"/><circle class="pulse" r="37.0"/>
      <text class="glyph" y="1">金</text>
      <text class="idx" x="-42" y="-24">04</text>
      <text class="lab down name" y="53">巧渡金沙江</text>
    </g>

    <!-- 05 泸定桥 4人 -->
    <g class="seal locked" data-level="lhdq,zjx,mmx,hry" tabindex="0" role="button"
       aria-label="飞夺泸定桥，4 个关卡" transform="translate(574,428)">
      <circle class="hit" r="48"/>
      <circle class="ring" r="36"/><circle class="pulse" r="41.0"/>
      <text class="glyph" y="1">泸</text>
      <text class="idx" x="-46" y="-26">05</text>
      <text class="lab left name" x="-50" y="2">飞夺泸定桥</text>
    </g>

    <!-- 06 雪山 2人 -->
    <g class="seal locked" data-level="jxf,lyc" tabindex="0" role="button"
       aria-label="翻越夹金山，2 个关卡" transform="translate(486,340)">
      <circle class="hit" r="46"/>
      <circle class="ring" r="32"/><circle class="pulse" r="37.0"/>
      <text class="glyph" y="1">雪</text>
      <text class="idx" x="-42" y="-24">06</text>
      <text class="lab left name" x="-48" y="2">翻越夹金山</text>
    </g>

    <!-- 07 草地 5人 -->
    <g class="seal locked" data-level="ftm,mhm,zzy,zbw,ldy" tabindex="0" role="button"
       aria-label="走出松潘草地，5 个关卡" transform="translate(386,268)">
      <circle class="hit" r="50"/>
      <circle class="ring" r="38"/><circle class="pulse" r="43.0"/>
      <text class="glyph" y="1">草</text>
      <text class="idx" x="-48" y="-28">07</text>
      <text class="lab right name" x="52" y="-4">走出草地</text>
    </g>

    <!-- 08 会宁：终点星章 -->
    <g class="seal locked final" data-level="hsj" tabindex="0" role="button"
       aria-label="会宁会师，终章" transform="translate(246,188)">
      <circle class="hit" r="56"/>
      <circle class="ring" r="44"/><circle class="pulse" r="49.0"/>
      <path class="glyph-star" d="M0,-30 L8.8,-6.3 L33.9,-6.3 L13.7,8.3
               L21.3,32.4 L0,18.6 L-21.3,32.4 L-13.7,8.3 L-33.9,-6.3 L-8.8,-6.3 Z"
            fill="none" stroke="#8e897e" stroke-width="2.6" stroke-linejoin="miter"/>
      <text class="idx" x="-56" y="-30">08</text>
      <text class="lab right name" x="52" y="2" style="font-size:17px">会宁会师</text>
    </g>

  </svg>

  <button class="back" id="btn-back" type="button">返回主页面</button>

  <div class="hint">
    <span>点击进入关卡</span>
    <span class="legend">
      <svg class="lg" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="#c8483a"/><circle cx="9" cy="9" r="8.5" fill="none" stroke="#c8483a" stroke-width="1" opacity=".45"/></svg>进行中
      <svg class="lg" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#c8483a" stroke-width="2" stroke-dasharray="3 2.6"/></svg>未通关
      <svg class="lg" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="#c8483a" stroke-width="2.6"/></svg>已通关
    </span>
  </div>

  <div class="tip" id="tip" role="status"></div>
</div>

<!-- 选关面板：点开某个事件后，列出该事件下所有成员的关卡卡片 -->
<div class="panel" id="panel" hidden>
  <div class="panel-veil" data-close></div>
  <div class="panel-box" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="panel-head">
      <h2 class="panel-title" id="panel-title"></h2>
      <button class="panel-close" type="button" data-close aria-label="关闭">&times;</button>
    </div>
    <div class="cards" id="cards"></div>
    <p class="panel-foot" id="panel-foot"></p>
  </div>
</div>

<!-- 关卡容器：点卡片后在这里加载该成员的关卡（iframe，互不干扰） -->
<div class="level-host" id="level-host" hidden>
  <div class="level-stage">
    <iframe class="level-frame" id="level-frame" title="关卡"></iframe>
    <button class="level-exit" id="level-exit" type="button">退出关卡</button>
  </div>
  <div class="level-loading" id="level-loading" hidden>
    <p class="level-loading-text" id="level-loading-text">正在进入关卡…</p>
    <p class="level-loading-sub" id="level-loading-sub"></p>
  </div>
</div>

<!-- 终章之后的尾声：黑屏金字，播完回开始页 -->
<div class="ending" id="ending" hidden>
  <div class="ending-inner">
    <p class="ending-line" style="animation-delay:.8s">一九三四年十月</p>
    <p class="ending-line" style="animation-delay:2s">八万六千人从于都出发</p>
    <p class="ending-line" style="animation-delay:3.6s">湘江血战，折损过半</p>
    <p class="ending-line" style="animation-delay:4.8s">遵义城头，转兵向西</p>
    <p class="ending-line" style="animation-delay:6s">四渡赤水，巧渡金沙，飞夺泸定</p>
    <p class="ending-line" style="animation-delay:7.2s">雪山埋骨，草地断粮</p>
    <p class="ending-line" style="animation-delay:8.8s">一九三六年十月，会宁会师</p>
    <p class="ending-line" style="animation-delay:10s">两万五千里</p>
    <p class="ending-line big" style="animation-delay:11.8s">山河已换人间</p>
  </div>
</div>

<div class="rotate-hint">
  <p>请把手机横过来<br>画面按 16:9 铺开</p>
</div>

<script src="core/save.js"></script>
<script>
(function () {
  'use strict';

  function fit() {
    /* 等比铺满：取宽高里较小的比例，保证整块舞台既放得下、
       又尽量填满窗口。这里刻意不设上限——窗口比 1280×720 大时，
       内容跟着放大，否则四周会留一圈黑边。 */
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.documentElement.style.setProperty('--s', s);
    /* 关卡舞台也是 1280×720，跟地图用同一个缩放比例，
       这样成员按 1280×720 摆的元素在任何屏幕上都对得上位置 */
    document.documentElement.style.setProperty('--level-s', s);
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  document.getElementById('btn-back').addEventListener('click', function () {
    if (window.CZSave) CZSave.touch();   // 记一下「上次游玩时间」
    location.href = 'index.html';
  });

  var seals = document.querySelectorAll('.seal');
  var tip = document.getElementById('tip');
  var stage = document.getElementById('stage');

  /* 四种状态的提示语 */
  var TIPS = {
    locked:  '请先完成前面的关卡',
    done:    '重新体验',
    current: '继续',
    final:   '恭喜抵达',
    pending: '这一站还在赶制，暂时进不去'
  };

  function stateOf(el) {
    if (el.classList.contains('pending')) return 'pending';
    if (el.classList.contains('current')) return 'current';
    if (el.classList.contains('done')) return 'done';
    return 'locked';
  }

  /* 把视口坐标换算到 1280×720 的舞台坐标 */
  function toStage(clientX, clientY) {
    var r = stage.getBoundingClientRect();
    var k = r.width / 1280 || 1;
    return { x: (clientX - r.left) / k, y: (clientY - r.top) / k };
  }

  function showTip(el, ev) {
    if (!tip) return;
    var key = stateOf(el);
    if (key === 'current' && el.classList.contains('final')) key = 'final';
    tip.textContent = TIPS[key];
    var p = toStage(ev.clientX, ev.clientY);
    tip.style.left = p.x + 'px';
    tip.style.top = p.y + 'px';
    tip.classList.add('show');
  }

  function hideTip() {
    if (tip) tip.classList.remove('show');
  }

  /* ---------- 选关面板 ----------
     点开一个印章 -> 地图压暗（is-dim）+ 脉冲暂停
     -> 面板里按成员数生成卡片，一张卡对应一个人的关卡

     ★ 卡片里的图片来自 levels/<缩写>/cover.webp
       这个文件是占位图，由该关卡的负责人自己替换成正式的封面。
       换图不用改任何代码，文件名和路径保持一致就行。
       规格：480×320（3:2 横图），单张 ≤ 300KB。 */
  var panel = document.getElementById('panel');
  var cardsBox = document.getElementById('cards');
  var panelTitle = document.getElementById('panel-title');
  var panelFoot = document.getElementById('panel-foot');
  var lastFocus = null;
  var currentNode = null;   // 当前打开的是哪个地点，通关后要回到它

  /* ---------- 关卡名 ----------
     成员在自己文件夹里放 meta.js 定义卡片上显示的名字。
     file:// 下 fetch / XHR 会被 CORS 拦（origin 是 null），
     只有动态插 <script> 能读到本地文件，所以走这条路。
     没有 meta.js 的关卡自动退回用 id，不会报错。 */
  var metaLoaded = {};

  function metaName(id) {
    var m = window.CZ_META && window.CZ_META[id];
    return (m && m.name) ? m.name : '';
  }

  function loadMetas(ids, done) {
    var todo = [];
    ids.forEach(function (id) {
      if (metaLoaded[id]) return;
      metaLoaded[id] = true;
      todo.push(id);
    });

    if (!todo.length) { done(); return; }

    var n = todo.length;
    todo.forEach(function (id) {
      var sc = document.createElement('script');
      sc.src = 'levels/' + id + '/meta.js';
      sc.onload = sc.onerror = function () {
        sc.onload = sc.onerror = null;
        if (sc.parentNode) sc.parentNode.removeChild(sc);   // 执行完就摘掉
        if (--n === 0) done();
      };
      document.head.appendChild(sc);
    });
  }

  /* 卡片先渲染，名字等 meta 到货再填——
     填之前留空，避免「id 闪一下变关卡名」；
     meta 加载失败（onerror）也会走到这里，那时退回显示 id。 */
  function refreshCardNames() {
    var cards = cardsBox.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var id = card.getAttribute('data-id');
      var name = metaName(id) || id;

      var label = card.querySelector('.card-id');
      if (label) label.textContent = name;

      // aria-label 和可见文字保持一致，屏幕阅读器读到的也是关卡名
      card.setAttribute('aria-label', !card.disabled
        ? '进入 ' + name + ' 的关卡'
        : name + ' 尚未解锁，请先完成左边的关卡');
    }
  }

  /* 只留已经做完的关卡。
     半成品的 id 照旧写在 data-level 里，只是不会出现在面板里——
     玩家看不到、点不进，但清单还在，做完一关加进 CZSave.SHIPPED 就放出来了。 */
  function isShipped(id) {
    var list = window.CZSave && CZSave.SHIPPED;
    return list ? list.indexOf(id) >= 0 : true;
  }

  function shippedIdsOf(el) {
    return (el.getAttribute('data-level') || '').split(',').filter(Boolean).filter(isShipped);
  }

  function openNode(el) {
    currentNode = el;
    var ids = shippedIdsOf(el);
    /* 这一站一关都没放出来：顺手清掉面板里上一站的卡片，
       免得下次打开时先闪一眼别人的图。 */
    if (!ids.length) { cardsBox.innerHTML = ''; closePanel(); return; }

    lastFocus = el;
    panelTitle.textContent = (el.querySelector('.name') || {}).textContent || '';
    cardsBox.innerHTML = '';

    /* 卡片按顺序解锁：已通关的可重玩，第一个没通关的是当前可玩的，
       它右边的全部锁住（灰掉 + 不可点） */
    var doneList = loadProgress();
    var lockedNext = false;

    ids.forEach(function (id) {
      var isDone = doneList.indexOf(id) >= 0;
      var usable = isDone || !lockedNext;
      if (!isDone) lockedNext = true;

      var btn = document.createElement('button');
      btn.className = 'card' + (isDone ? ' is-done' : '') + (usable ? '' : ' is-locked');
      btn.type = 'button';
      btn.setAttribute('data-id', id);
      btn.disabled = !usable;

      var pic = document.createElement('span');
      pic.className = 'card-pic';
      var img = document.createElement('img');
      img.src = 'levels/' + id + '/cover.webp';
      img.alt = id + ' 的关卡封面';
      // 封面缺失时不要露出破图标，让占位底色顶住
      img.addEventListener('error', function () { img.style.display = 'none'; });
      pic.appendChild(img);

      if (isDone) {
        var mark = document.createElement('span');
        mark.className = 'card-mark';
        mark.textContent = '已通关';
        pic.appendChild(mark);
      }

      var label = document.createElement('span');
      label.className = 'card-id';
      label.textContent = metaName(id);   // meta 没到货时先空着，refreshCardNames 会填

      btn.appendChild(pic);
      btn.appendChild(label);
      if (usable) {
        btn.addEventListener('click', function () { enterLevel(id); });
      }
      cardsBox.appendChild(btn);
    });

    /* 会宁是终点，这里不是「解锁下一站」，而是回望全程 */
    if (el.classList.contains('final')) {
      panelFoot.textContent = '回顾这趟旅程';
    } else if (ids.length > 1) {
      panelFoot.textContent = '这 ' + ids.length + ' 关全部通关，才会解锁下一个地点';
    } else {
      panelFoot.textContent = '通关这一关，才会解锁下一个地点';
    }

    panel.hidden = false;
    stage.classList.add('is-dim');
    hideTip();

    loadMetas(ids, refreshCardNames);
  }

  function closePanel() {
    panel.hidden = true;
    stage.classList.remove('is-dim');
    if (lastFocus) lastFocus.focus();
  }

  /* ---------- 进度 ----------
     存在 localStorage 的 cz.progress 里，值是【已通关的成员 id】数组。
     一个事件里只要有一个人通关，这个事件就算过了（并联，谁都不卡谁）。 */
  /* 进度直接存在当前存档挡位里（真身在 core/save.js）。
     没有挡位时（比如直接打开 map.html）读到的就是空进度，
     游戏照样能玩，只是不落盘。 */
  function loadProgress() {
    return (window.CZSave && CZSave.activeProgress()) || [];
  }

  function saveProgress(list) {
    if (window.CZSave) CZSave.setProgress(list);
  }

  function markDone(id) {
    if (window.CZSave) CZSave.pushProgress(id);
  }

  /* 「已放出的关卡是不是全通了」。
     尾声的触发条件从「打完会宁那一站」改成这个——
     会宁还在做、被屏蔽着的时候，打完草地照样能正常收尾；
     以后把会宁放出来，打完它同样满足这里的条件，逻辑不用再改。 */
  function allShippedDone() {
    var list = (window.CZSave && CZSave.SHIPPED) || [];
    if (!list.length) return false;
    var done = loadProgress();
    for (var i = 0; i < list.length; i++) {
      if (done.indexOf(list[i]) < 0) return false;
    }
    return true;
  }

  /* 按进度刷新节点：已通关 = done，第一个没过的 = current，后面全 locked。
     一关都还没做完的站点标成 pending，不参与这条解锁链——
     否则它会卡在那儿，后面的站点永远解不开。 */
  function refreshStates() {
    var done = loadProgress();
    var unlocked = true;   // 前面的地点是否已全部通关

    for (var i = 0; i < seals.length; i++) {
      var el = seals[i];
      var ids = shippedIdsOf(el);

      el.classList.remove('locked', 'done', 'current', 'pending');

      if (ids.length === 0) {
        el.classList.add('pending');
        continue;
      }

      var allDone = true;
      for (var k = 0; k < ids.length; k++) {
        if (done.indexOf(ids[k]) < 0) { allDone = false; break; }
      }

      if (allDone) {
        el.classList.add('done');
      } else if (unlocked) {
        el.classList.add('current');
        unlocked = false;
      } else {
        el.classList.add('locked');
      }
    }
  }

  /* ---------- 关卡容器 ----------
     用 iframe 加载 levels/<id>/test/index.html：
     每个成员的 CSS / JS 都在自己的文档里，不会互相污染 */
  var levelHost = document.getElementById('level-host');
  var levelFrame = document.getElementById('level-frame');
  var levelExit = document.getElementById('level-exit');
  var playingId = null;

  function enterLevel(id) {
    playingId = id;
    /* 约定：入口固定为 levels/<id>/index.html。
       成员只要保证这个文件存在、能在里面 postMessage 通关即可，
       主程序不用为任何一个人改代码。 */
    levelFrame.src = 'levels/' + id + '/index.html';
    levelHost.hidden = false;
    closePanel();
    startLoadWatch();
  }

  function closeLevel() {
    stopLoadWatch();
    levelHost.hidden = true;
    levelFrame.src = 'about:blank';   // 停掉关卡里的计时器/动画
    playingId = null;
    fit();                            // iframe 期间窗口尺寸若变过，这里把舞台缩放算回来
  }

  /* ---------- 关卡加载监控 ----------
     iframe 加载失败不会抛错，只会白屏，新手很难自己看出问题。
     这里给 6 秒兜底：还没 load 就把原因直接写在屏幕上。 */
  var levelLoading = document.getElementById('level-loading');
  var loadingText = document.getElementById('level-loading-text');
  var loadingSub = document.getElementById('level-loading-sub');
  var loadTimer = null;
  var loadedOk = false;

  function startLoadWatch() {
    loadedOk = false;
    clearTimeout(loadTimer);
    levelLoading.hidden = false;
    levelLoading.classList.remove('is-error');
    loadingText.textContent = '正在进入关卡…';
    loadingSub.textContent = '';

    loadTimer = setTimeout(function () {
      if (!loadedOk) showLoadError('等了 6 秒还没加载出来');
    }, 6000);
  }

  function stopLoadWatch() {
    clearTimeout(loadTimer);
    levelLoading.hidden = true;
    levelLoading.classList.remove('is-error');
  }

  function showLoadError(reason) {
    clearTimeout(loadTimer);
    levelLoading.hidden = false;
    levelLoading.classList.add('is-error');
    loadingText.textContent = '这一关没能打开';
    loadingSub.textContent = reason + '。先确认 levels/' + (playingId || '?')
      + '/index.html 存在，再按 F12 看控制台有没有报错。';
  }

  levelFrame.addEventListener('load', function () {
    if (!playingId) return;

    /* 关键：只认「当前这一关」的 load。
       上一个关卡关闭时会把 src 设成 about:blank，那个 load 是异步的，
       玩家手快紧接着进下一关时，它会晚一步到达。
       不比对 URL 的话，就会把新关卡还没加载完的提示层提前关掉。 */
    var want = 'levels/' + playingId + '/index.html';
    if ((levelFrame.getAttribute('src') || '') !== want) return;

    loadedOk = true;
    clearTimeout(loadTimer);
    levelLoading.hidden = true;
  });

  /* 「退出关卡」和关卡内发 cz:exit 走同一条路：
     关掉关卡、回到这个地点的选关面板，而不是丢在地图上让玩家重新点印章 */
  levelExit.addEventListener('click', function () {
    closeLevel();
    if (currentNode) openNode(currentNode);
  });

  /* ---------- 尾声 ----------
     会宁通关后播黑屏金字，播完自动回开始页 */
  var ending = document.getElementById('ending');

  function playEnding() {
    var lines = ending.querySelectorAll('.ending-line');
    ending.hidden = false;

    // 重置动画，保证逐行出现（重播也不会一次全冒出来）
    for (var i = 0; i < lines.length; i++) {
      lines[i].style.animation = 'none';
      void lines[i].offsetWidth;
      lines[i].style.animation = '';
    }

    requestAnimationFrame(function () { ending.classList.add('is-on'); });

    setTimeout(function () {
      location.href = 'index.html';   // 播完回开始页面
    }, 15000);
  }

  /* 关卡通关后由 level.js 用 postMessage 通知过来 */
  window.addEventListener('message', function (e) {
    /* 只认关卡那个 iframe 发来的消息。别的窗口/页面往这里 postMessage
       一律不理，免得被外部页面误触发送关。 */
    if (!levelFrame.contentWindow || e.source !== levelFrame.contentWindow) return;
    if (!e.data) return;

    /* 关卡自己想退出（它内部可以放个「返回」按钮调这个） */
    if (e.data.type === 'cz:exit') {
      closeLevel();
      if (currentNode) openNode(currentNode);
      return;
    }

    if (e.data.type !== 'cz:done') return;

    /* 「刚刚」把最后一关打通了才播尾声。
       已经全通过的玩家回头重玩某一关，不应该再看一遍 15 秒的黑屏金字。 */
    var wasAllDone = allShippedDone();
    if (playingId) markDone(playingId);
    refreshStates();

    var finished = !wasAllDone && allShippedDone();

    /* 不停留、不盖「通关」：关掉关卡立刻回到面板，
       反馈交给面板里刚变红的那张卡 */
    closeLevel();
    if (finished) {
      playEnding();                                    // 全部放出的关卡刚好通关：播尾声
    } else if (currentNode) {
      openNode(currentNode);                            // 否则留在本地点继续选
    }
  });

  panel.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closePanel();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!levelHost.hidden) { closeLevel(); return; }
    if (!panel.hidden) closePanel();
  });

  /* ---------- 开局 ----------
     ?reset=1  清空当前挡位进度（加了一次确认，免得转发链接把别人的档清了）
     ?all=1    把已放出的关卡全标成通关，用来直接看尾声 */
  if (/[?&]reset=1\b/.test(location.search)) {
    if (window.confirm('清空当前存档的通关记录？这一步不可撤销。')) {
      saveProgress([]);
    }
  }

  if (/[?&]all=1\b/.test(location.search) && window.CZSave) {
    /* 以前没有挡位时 setProgress 会直接返回 false，参数等于白写。
       这里先补一个挡位，「直接看尾声」才真的能用。
       注意别覆盖已经存在的挡位 1——那可能是别人的真实进度。 */
    if (!CZSave.getActive()) {
      if (CZSave.read(1)) CZSave.setActive(1);
      else CZSave.create(1);
    }
    saveProgress(CZSave.SHIPPED.slice());
  }

  refreshStates();

  /* 印章事件绑定：点击进关、悬停提示、键盘可达 */


  for (var i = 0; i < seals.length; i++) {
    (function (el) {
      function go() {
        var st = stateOf(el);
        if (st === 'locked' || st === 'pending') return;  // 没解锁的、还没做完的，都不让进
        openNode(el);
      }
      el.addEventListener('click', go);
      el.addEventListener('mouseenter', function (e) { showTip(el, e); });
      el.addEventListener('mousemove', function (e) { showTip(el, e); });
      el.addEventListener('mouseleave', hideTip);
      el.addEventListener('focus', function () {
        var r = el.getBoundingClientRect();
        showTip(el, { clientX: r.left + r.width / 2, clientY: r.top });
      });
      el.addEventListener('blur', hideTip);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    })(seals[i]);
  }

})();
</script>

</body>
</html>
