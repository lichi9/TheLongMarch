<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150403">
<title>长征：拾光</title>
<link rel="stylesheet" href="core/menu.css">
</head>
<body>

<div id="stage">
  <div class="vignette"></div>

  <h1 class="title">
    <img src="assets/brand/menu/title.png" alt="长征：拾光">
  </h1>

  <nav class="menu" aria-label="主菜单">
    <button class="btn" id="btn-start" type="button">
      <img src="assets/brand/menu/btn-start.png" alt="开始">
    </button>
    <button class="btn" id="btn-continue" type="button">
      <img src="assets/brand/menu/btn-continue.png" alt="继续">
    </button>
    <button class="btn" id="btn-exit" type="button">
      <img src="assets/brand/menu/btn-exit.png" alt="退出">
    </button>
  </nav>

  <div class="grain"></div>

  <div class="farewell" id="farewell" aria-hidden="true">
    <div class="l1">感谢游玩</div>
    <div class="l2">可以关闭这个标签页了</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 存档面板：开始 → 新建；继续 → 读取 -->
  <div class="saves" id="saves" hidden>
    <div class="saves-veil" data-close></div>
    <div class="saves-box" role="dialog" aria-modal="true" aria-labelledby="saves-title">
      <h2 class="saves-title" id="saves-title">选择存档</h2>
      <p class="saves-sub" id="saves-sub"></p>
      <div class="slots" id="slots"></div>
      <button class="saves-cancel" type="button" data-close>取消</button>
    </div>
  </div>
</div>

<div class="rotate-hint">
  <div class="ico"></div>
  <p>请把手机横过来<br>画面按 16:9 铺开</p>
</div>

<script src="core/save.js"></script>
<script>
(function () {
  'use strict';

  var STAGE_W = 1280;
  var STAGE_H = 720;
  /* ---------- 存档 ----------
     8 个挡位，全部存在浏览器本地。真身在 core/save.js，这里只管界面。 */
  var savesEl = document.getElementById('saves');
  var slotsEl = document.getElementById('slots');
  var savesTitle = document.getElementById('saves-title');
  var savesSub = document.getElementById('saves-sub');

  var saveMode = 'new';   // new = 新建（可覆盖已有） / continue = 读取
  var confirmSlot = 0;    // 等第二次点击确认覆盖的挡位
  var confirmTimer = null;

  var btnStart = document.getElementById('btn-start');
  var btnContinue = document.getElementById('btn-continue');
  var btnExit = document.getElementById('btn-exit');
  var farewell = document.getElementById('farewell');
  var toastEl = document.getElementById('toast');

  ['click', 'pointerdown'].forEach(function (ev) {
    btnStart.addEventListener(ev, function (e) {
      e.preventDefault();
      openSaves('new');
    });
  });

  ['click', 'pointerdown'].forEach(function (ev) {
    btnContinue.addEventListener(ev, function (e) {
      e.preventDefault();
      if (btnContinue.disabled) return;
      openSaves('continue');
    });
  });

  /* 没有任何存档时，「继续」置灰 */
  if (!window.CZSave || !CZSave.hasAny()) {
    btnContinue.disabled = true;
    btnContinue.setAttribute('aria-disabled', 'true');
    btnContinue.title = '还没有存档记录';
  }

  /* ---------- 轻提示 ---------- */
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('on');
    }, 2200);
  }

  /* ---------- 存档面板 ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderSlots() {
    var list = CZSave.summary();
    slotsEl.innerHTML = '';

    list.forEach(function (s) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'slot'
        + (s.empty ? ' is-empty' : '')
        + (s.slot === confirmSlot ? ' is-confirm' : '');
      btn.dataset.slot = s.slot;

      if (s.empty && saveMode === 'continue') btn.disabled = true;

      var no = document.createElement('span');
      no.className = 'slot-no';
      no.textContent = pad(s.slot);

      var main = document.createElement('span');
      main.className = 'slot-main';

      var meta = document.createElement('span');
      meta.className = 'slot-meta';

      if (s.empty) {
        main.textContent = saveMode === 'new' ? '点击新建存档' : '空挡位';
        meta.textContent = saveMode === 'new' ? '从这里开始新的行军' : ' ';
      } else if (s.slot === confirmSlot) {
        main.textContent = '再点一次覆盖';
        meta.textContent = '已通关 ' + s.progress + ' / ' + s.total + ' 关　（覆盖不可撤销）';
      } else {
        main.textContent = '已通关 ' + s.progress + ' / ' + s.total + ' 关';
        meta.textContent = '创建 ' + fmtTime(s.createdAt) + '　·　上次 ' + fmtTime(s.playedAt);
      }

      btn.appendChild(no);
      btn.appendChild(main);
      btn.appendChild(meta);
      btn.addEventListener('click', function () { choose(s); });
      slotsEl.appendChild(btn);
    });
  }

  function choose(s) {
    if (!window.CZSave) return;

    if (saveMode === 'continue') {
      if (s.empty) return;
      CZSave.setActive(s.slot);
      go();
      return;
    }

    if (s.empty) {
      CZSave.create(s.slot);
      go();
      return;
    }

    // 已有存档：第一下是确认，第二下才真的覆盖
    if (confirmSlot === s.slot) {
      CZSave.create(s.slot);
      go();
      return;
    }

    confirmSlot = s.slot;
    renderSlots();
    if (confirmTimer) clearTimeout(confirmTimer);
    confirmTimer = setTimeout(function () {
      confirmSlot = 0;
      renderSlots();
    }, 3200);
  }

  function openSaves(mode) {
    if (!window.CZSave) { toast('这个浏览器没法存本地档'); return; }
    saveMode = mode;
    confirmSlot = 0;
    savesTitle.textContent = mode === 'new' ? '新建存档' : '读取存档';
    savesSub.textContent = mode === 'new'
      ? '选一个位置开始新游戏。点已有存档会覆盖，需要再点一次确认。'
      : '选一个存档接着玩，空挡位不能选。';
    renderSlots();
    savesEl.hidden = false;
  }

  function closeSaves() {
    savesEl.hidden = true;
    confirmSlot = 0;
    renderSlots();
  }

  function go() {
    location.href = 'map.html';
  }

  savesEl.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeSaves();
  });

  /* ---------- 退出 ----------
     浏览器里 window.close() 只对脚本自己开的窗口有效，
     普通标签页调它会静默失败。所以关不掉就给一块收尾屏，
     而不是让按钮看起来坏了。 */
  btnExit.addEventListener('click', function () {
    window.close();
    setTimeout(function () {
      if (!document.hidden) {
        farewell.classList.add('on');
        farewell.setAttribute('aria-hidden', 'false');
      }
    }, 260);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && farewell.classList.contains('on')) {
      farewell.classList.remove('on');
      farewell.setAttribute('aria-hidden', 'true');
    }
  });
})();
</script>

</body>
</html>
