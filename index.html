<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150403">
<title>长征：拾光</title>
<link rel="stylesheet" href="core/menu.css">
</head>
<body>

<div id="stage">
  <div class="vignette"></div>

  <h1 class="title">
    <img src="assets/brand/menu/title.png" alt="长征：拾光">
  </h1>

  <nav class="menu" aria-label="主菜单">
    <button class="btn" id="btn-start" type="button">
      <img src="assets/brand/menu/btn-start.png" alt="开始">
    </button>
    <button class="btn" id="btn-continue" type="button">
      <img src="assets/brand/menu/btn-continue.png" alt="继续">
    </button>
    <button class="btn" id="btn-exit" type="button">
      <img src="assets/brand/menu/btn-exit.png" alt="退出">
    </button>
  </nav>

  <div class="grain"></div>

  <div class="farewell" id="farewell" aria-hidden="true">
    <div class="l1">感谢游玩</div>
    <div class="l2">可以关闭这个标签页了</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="rotate-hint">
  <div class="ico"></div>
  <p>请把手机横过来<br>画面按 16:9 铺开</p>
</div>

<script>
(function () {
  'use strict';

  var STAGE_W = 1280;
  var STAGE_H = 720;
  var SAVE_KEY = 'cz.save';

  /* ---------- 舞台等比缩放 ---------- */
  function fit() {
    var s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    document.documentElement.style.setProperty('--s', s);
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  /* ---------- 存档探测 ----------
     真正的存档结构等 core 定了再替换，现在只判断「有没有」。
     localStorage 在 file:// 下可用；隐私模式或个别浏览器会抛异常，
     所以整段包在 try 里，取不到就当没有存档。 */
  var forceSave = /[?&]save=1\b/.test(location.search);

  function hasSave() {
    if (forceSave) return true;
    try {
      return !!window.localStorage.getItem(SAVE_KEY);
    } catch (e) {
      return false;
    }
  }

  var btnStart = document.getElementById('btn-start');
  var btnContinue = document.getElementById('btn-continue');
  var btnExit = document.getElementById('btn-exit');
  var farewell = document.getElementById('farewell');
  var toastEl = document.getElementById('toast');

  if (!hasSave()) {
    btnContinue.disabled = true;
    btnContinue.setAttribute('aria-disabled', 'true');
    btnContinue.title = '还没有存档记录';
  }

  /* ---------- 轻提示 ---------- */
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('on');
    }, 2200);
  }

  /* ---------- 进入游戏 ----------
     接入 core 之后把这里换成真正的跳转：
       location.href = 'game.html'            // 独立页面
     或 CZ.boot({ level: 'first', fresh: true })  // 同页切换
     两种都行，先把入口留在这里，别让按钮点了没反应。 */
  function enterGame(mode) {
    if (window.CZ && typeof window.CZ.startGame === 'function') {
      window.CZ.startGame(mode);
      return;
    }
    toast(mode === 'continue' ? '继续：存档入口还没接上' : '开始：序章还没接上');
  }

  btnStart.addEventListener('click', function () {
    enterGame('new');
  });

  btnContinue.addEventListener('click', function () {
    if (btnContinue.disabled) return;
    enterGame('continue');
  });

  /* ---------- 退出 ----------
     浏览器里 window.close() 只对脚本自己开的窗口有效，
     普通标签页调它会静默失败。所以关不掉就给一块收尾屏，
     而不是让按钮看起来坏了。 */
  btnExit.addEventListener('click', function () {
    window.close();
    setTimeout(function () {
      if (!document.hidden) {
        farewell.classList.add('on');
        farewell.setAttribute('aria-hidden', 'false');
      }
    }, 260);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && farewell.classList.contains('on')) {
      farewell.classList.remove('on');
      farewell.setAttribute('aria-hidden', 'true');
    }
  });
})();
</script>

</body>
</html>
